<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C2185B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Julia">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Julia Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna para celular, abas fixas embaixo, cartões de exercício que abrem para registrar séries */
:root{
  --bg:#F2F1F4; --surface:#FFFFFF; --sunk:#E8E6EC; --fg:#1C1A22; --muted:#6B6775;
  --line:#DAD7E0; --accent:#C2185B; --accent-ink:#FFFFFF; --accent-soft:#F8DCE7;
  --ok:#2E7D5B; --ok-soft:#D7EFE3; --warn:#B26A00; --warn-soft:#FBEBD0;
  --muscle:#D0CCD8; --muscle-on:#C2185B;
  --skin:#D4A07E; --hair:#2B1A12; --outfit:#1F1C25; --shoe:#FFFFFF; --iron:#55505E;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121016; --surface:#1C1922; --sunk:#26222E; --fg:#F1EEF5; --muted:#A39DAE;
  --line:#332E3C; --accent:#FF5C93; --accent-ink:#1A0610; --accent-soft:#3C1A29;
  --ok:#5CCB98; --ok-soft:#183427; --warn:#F2B24C; --warn-soft:#3A2A10;
  --muscle:#3A3544; --muscle-on:#FF5C93; --skin:#D4A07E; --hair:#4A2E1E; --outfit:#5A5368; --shoe:#E8E4EE; --iron:#9C96A8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121016; --surface:#1C1922; --sunk:#26222E; --fg:#F1EEF5; --muted:#A39DAE;
  --line:#332E3C; --accent:#FF5C93; --accent-ink:#1A0610; --accent-soft:#3C1A29;
  --ok:#5CCB98; --ok-soft:#183427; --warn:#F2B24C; --warn-soft:#3A2A10;
  --muscle:#3A3544; --muscle-on:#FF5C93; --skin:#D4A07E; --hair:#4A2E1E; --outfit:#5A5368; --shoe:#E8E4EE; --iron:#9C96A8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 150px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:20px}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* cabeçalho do dia */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.day b{font-family:var(--display);font-size:17px;line-height:1}
.day small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day[aria-pressed="true"] small{color:inherit;opacity:.75}
.day.today{box-shadow:inset 0 -3px 0 var(--accent)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* cartões */
.list{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex.done{border-color:var(--ok)}
.ex summary{list-style:none;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.ex summary::-webkit-details-marker{display:none}
.idx{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-family:var(--display);font-size:18px;font-weight:700}
.ex.done .idx{background:var(--ok);color:var(--surface)}
.ex .t{min-width:0}
.ex .t b{display:block;font-weight:700;line-height:1.25}
.ex .t span{font-size:13px;color:var(--muted)}
.ex .body{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px}
.anim{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.anim svg{width:100%;max-width:340px;height:auto;margin:0 auto;display:block;aspect-ratio:200/160}
.anim figcaption{font-size:13px;font-weight:600;text-align:center;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.anim .live{font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.demo{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.demo svg{width:120px;height:auto;max-width:100%}
.demo ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn svg{width:16px;height:16px;flex:none}
.tip{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.tip.up{background:var(--ok-soft);color:var(--ok)}
.tip.hold{background:var(--warn-soft);color:var(--warn)}
.sets{display:flex;flex-direction:column;gap:6px}
.sets .hd,.set{display:grid;grid-template-columns:44px 1fr 1fr 48px;gap:8px;align-items:center}
.sets .hd{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.set .n{font-family:var(--display);font-size:18px;font-weight:700;text-align:center}
.set input{width:100%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;text-align:center;font-variant-numeric:tabular-nums}
.chk{width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center}
.chk svg{width:20px;height:20px;opacity:.35}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.chk[aria-pressed="true"] svg{opacity:1}

.setgrp{display:flex;flex-direction:column;gap:3px}
.setmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 2px 2px;flex-wrap:wrap}
.setmeta .prev{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rirbox{display:inline-flex;align-items:center;gap:4px}
.rirlbl{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.rir{width:26px;height:26px;border:1px solid var(--line);background:var(--bg);border-radius:7px;font-size:13px;font-weight:700;color:var(--muted);line-height:1}
.rir[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.swap{align-self:flex-start;border-color:var(--accent);color:var(--accent)}
.notewrap{display:flex;flex-direction:column;gap:5px}
.nota{width:100%;min-height:52px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;font:14px/1.4 var(--body);color:var(--fg);resize:vertical}
.cardio{background:var(--fg);color:var(--bg);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.cardio .muted{color:inherit;opacity:.7}
.cardio .clock{font-family:var(--display);font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.cardio .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.cardio .btn{background:transparent;color:inherit;border-color:currentColor}
.cardio .btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cardio .bar{background:rgba(127,127,127,.35)}

.rest-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px}

/* semana */
.week{display:flex;flex-direction:column;gap:10px}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.wk header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wk ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}

/* progresso */
.prog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.prog .spark{grid-column:1/-1}
.prog svg{width:100%;height:40px;display:block}
.empty{padding:24px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}

/* ajustes */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px}
.field input,.field select{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;text-align:center}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--fg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}

/* timer de descanso e navegação */
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.timer > div{pointer-events:auto;width:100%;max-width:528px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer b{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.timer span{flex:1;font-size:13px;font-weight:600}
.timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.03em}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
@media (max-width:380px){.demo{grid-template-columns:1fr}.demo svg{width:140px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<main class="wrap" id="app"></main>
<div class="timer" id="timer" hidden><div><b id="tclock">0:00</b><span id="tlabel">Descanso</span><button id="tadd" type="button">+15s</button><button id="tstop" type="button">Pular</button></div></div>
<nav class="tabs" aria-label="Seções">
  <a href="#hoje" data-tab="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Treino</a>
  <a href="#semana" data-tab="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semana</a>
  <a href="#progresso" data-tab="progresso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18M5 15l4-4 4 3 6-7"/></svg>Progresso</a>
  <a href="#ajustes" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</a>
</nav>

<script type="module" src="/src/app.js"></script>

</body></html>
